version: v2

# Generated code lands under internal/platform/, alongside the other
# service-to-service infrastructure (internalapi, serviceclient, servicehost),
# so it is covered by the Makefile's existing ./internal/... package list.
plugins:
  - local: protoc-gen-go
    out: internal/platform/grpcapi
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: internal/platform/grpcapi
    opt: paths=source_relative
